version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: slaf-tts-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SlafRootSecretPass123!
      MYSQL_DATABASE: slaf_tts_db
      MYSQL_USER: slaf_admin
      MYSQL_PASSWORD: SlafAdminSecretPass123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "slaf_admin", "-pSlafAdminSecretPass123!"]
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: slaf-tts-backend
    restart: always
    environment:
      - DB_ENGINE=mysql
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=slaf_admin
      - MYSQL_PASSWORD=SlafAdminSecretPass123!
      - MYSQL_DATABASE=slaf_tts_db
      - JWT_SECRET_KEY=45c4779fe379d71c89f5bc3a6c2f0f4a86161474ea595d73bb851d7cf9d2c180
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=Admin@123
      - ADMIN_EMAIL=admin@slaf.lk
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: slaf-tts-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads_data:
